[metadata]
name = rfc-http-miner
version = 0.1.0
description = Evidence-first OSS HTTP API standardization opportunity miner
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE
author = pushnanashi2

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    rfc-miner = rfc_miner.cli:main

[options.package_data]
rfc_miner = py.typed
